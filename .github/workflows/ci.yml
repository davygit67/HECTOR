name: HECTOR checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run electron:install
      - run: npm run check
      # Real Electron windows on the runner's virtual display. Not projector or interactive qualification.
      # On macOS the capture test is skipped: Screen Recording permission cannot be granted non-interactively.
      - run: npm run smoke
      - name: Unsigned distributables (no signing, no notarization)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: hector-${{ runner.os }}-unsigned
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ runner.os }}
          path: test-results/
          retention-days: 7
