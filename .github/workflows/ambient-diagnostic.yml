name: Ambient Windows diagnosis
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ambient:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run electron:install
      - run: npm run build
      - run: npx playwright test --project=qualification --grep "ambient settings"
